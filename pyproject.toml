[project]
name = "note-mcp"
version = "0.0.1"
description = "MCP server for managing note.com articles"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["mcp", "note.com", "blog", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4.11,<4",
    "certifi>=2026.10.19",
    "typer>=0.15,<1",
    "playwright>=1.40.0",
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12.0",
    "mitmproxy>=12.2.2",
    "mypy>=1.19.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.4",
    "types-beautifulsoup4>=4.12.0",
    "types-pyyaml>=6.0.0",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinxcontrib-mermaid>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_mcp"]

[tool.ruff]
include = ["*.py", "*.pyi", "*.ipynb"]
line-length = 120
target-version = "py313"
exclude = ["tests/manual"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP042"]  # Existing str/Enum semantics are preserved during security upgrades.

[tool.ruff.lint.isort]
known-first-party = ["note_mcp"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^debug/", "^tests/manual/"]

[[tool.mypy.overrides]]
module = "mitmproxy.*"
ignore_errors = true
follow_imports = "skip"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_auth: tests requiring real authentication",
    "e2e: end-to-end tests",
    "docker: tests requiring Docker environment with browser/proxy",
    "playwright: tests requiring Playwright browser automation",
]

[tool.uv]
required-version = ">=0.13.4"
constraint-dependencies = [
    "pyperclip>=1.11.0",
    "anyio>=4.14.2", "cryptography>=50.0.0", "h11>=0.16.0",
    "httpcore>=1.0.9", "h2>=4.4.1", "hpack>=4.2.0", "idna>=3.15",
    "joserfc>=1.6.8", "mcp>=1.30.0,<2", "msgpack>=1.2.1",
    "opentelemetry-api>=1.45.1", "pillow>=13.0.0", "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2", "pygments>=2.20.0", "pyjwt>=2.15.0",
    "pyopenssl>=26.0.0", "python-dotenv>=1.2.2", "python-multipart>=0.0.31",
    "requests>=2.33.0", "soupsieve>=2.9.0", "starlette>=1.3.1", "tornado>=6.5.9",
    "urllib3>=2.8.0", "pytest>=9.0.3",
]
